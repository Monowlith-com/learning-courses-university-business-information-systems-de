<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Atomare Umlagerung</title><desc id="desc">Ausgangsbestand A 1, B 0; Umlagerung mit COMMIT ergibt A 0, B 1; ROLLBACK erhält A 1, B 0.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Atomare Umlagerung</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Zwei Änderungen, eine Transaktionsgrenze</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="55" y="207" width="220" height="80" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="165.0" y="241.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Ausgang</text><text x="165.0" y="267.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">A = 1, B = 0</text><line x1="275" y1="247" x2="330" y2="247" stroke="#26729b" stroke-width="3"/><line x1="330" y1="247" x2="319.4690092573155" y2="252.75310646325045" stroke="#26729b" stroke-width="3"/><line x1="330" y1="247" x2="319.4690092573155" y2="241.24689353674955" stroke="#26729b" stroke-width="3"/><rect x="330" y="165" width="380" height="165" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="520.0" y="228.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">BEGIN</text><text x="520.0" y="254.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">A um 1 vermindern</text><text x="520.0" y="280.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">B um 1 erhöhen</text><line x1="710" y1="222" x2="825" y2="182" stroke="#26729b" stroke-width="3"/><line x1="825" y1="182" x2="816.943527108053" y2="190.893438285687" stroke="#26729b" stroke-width="3"/><line x1="825" y1="182" x2="813.1634988467316" y2="180.0258570343879" stroke="#26729b" stroke-width="3"/><line x1="710" y1="270" x2="825" y2="318" stroke="#26729b" stroke-width="3"/><line x1="825" y1="318" x2="813.0655765988162" y2="319.252812069416" stroke="#26729b" stroke-width="3"/><line x1="825" y1="318" x2="817.497598511303" y2="308.6344262374163" stroke="#26729b" stroke-width="3"/><rect x="825" y="140" width="320" height="83" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="985.0" y="175.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">COMMIT</text><text x="985.0" y="201.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">A = 0, B = 1</text><rect x="825" y="277" width="320" height="83" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="985.0" y="312.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">ROLLBACK</text><text x="985.0" y="338.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">A = 1, B = 0</text><text x="55" y="375" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Gesamtbestand: 1; bei Fehler werden beide Änderungen verworfen.</text></g></svg>
