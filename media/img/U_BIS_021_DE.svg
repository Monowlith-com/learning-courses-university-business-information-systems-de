<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Systemübergreifender Verkaufsauftrag</title><desc id="desc">CRM-Verkaufsauftrag löst ERP-Auftrag und Reservierung aus; SCM koordiniert Nachschub anhand derselben Artikel-ID.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Systemübergreifender Verkaufsauftrag</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Beispiel für führende Daten und fachliche Schnittstellen</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="65" y="160" width="290" height="100" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="210.0" y="204.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">CRM</text><text x="210.0" y="228.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Verkaufsauftrag</text><rect x="455" y="160" width="290" height="100" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="600.0" y="204.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">ERP</text><text x="600.0" y="228.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Auftrag + Reservierung</text><rect x="845" y="160" width="290" height="100" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="990.0" y="204.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">SCM</text><text x="990.0" y="228.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Nachschub koordinieren</text><line x1="355" y1="210" x2="455" y2="210" stroke="#26729b" stroke-width="3"/><line x1="455" y1="210" x2="445.3465918192059" y2="215.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="455" y1="210" x2="445.3465918192059" y2="204.72631907535376" stroke="#26729b" stroke-width="3"/><line x1="745" y1="210" x2="845" y2="210" stroke="#26729b" stroke-width="3"/><line x1="845" y1="210" x2="835.3465918192059" y2="215.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="845" y1="210" x2="835.3465918192059" y2="204.72631907535376" stroke="#26729b" stroke-width="3"/><line x1="210" y1="260" x2="210" y2="315" stroke="#67717b" stroke-width="2"/><line x1="600" y1="260" x2="600" y2="315" stroke="#67717b" stroke-width="2"/><line x1="990" y1="260" x2="990" y2="315" stroke="#67717b" stroke-width="2"/><line x1="210" y1="315" x2="990" y2="315" stroke="#67717b" stroke-width="2"/><text x="600" y="352" font-size="21" text-anchor="middle" fill="#23272b" font-weight="normal">Gemeinsame Artikel-ID; führendes System festlegen</text><text x="600" y="382" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">Kein Anspruch auf eine bestimmte Produktarchitektur.</text></g></svg>
