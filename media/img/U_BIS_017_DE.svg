<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Von der Anforderung zum Akzeptanztest</title><desc id="desc">Akzeptanztest für Bestand null: Reservierung abgelehnt, Bestand bleibt null.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Von der Anforderung zum Akzeptanztest</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Testfall für eine nicht verfügbare Ware</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="65" y="145" width="1070" height="70" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="600.0" y="187.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">R1: Reservierung ohne verfügbaren Bestand ablehnen</text><rect x="65" y="245" width="320" height="100" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="225.0" y="289.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Gegeben</text><text x="225.0" y="315.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Bestand = 0</text><rect x="440" y="245" width="320" height="100" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="600.0" y="289.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Wenn</text><text x="600.0" y="315.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Reservierung versucht</text><rect x="815" y="245" width="320" height="100" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="975.0" y="276.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Dann</text><text x="975.0" y="302.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Ablehnung</text><text x="975.0" y="328.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Bestand = 0</text><line x1="385" y1="295" x2="440" y2="295" stroke="#26729b" stroke-width="3"/><line x1="440" y1="295" x2="429.4690092573155" y2="300.75310646325045" stroke="#26729b" stroke-width="3"/><line x1="440" y1="295" x2="429.4690092573155" y2="289.24689353674955" stroke="#26729b" stroke-width="3"/><line x1="760" y1="295" x2="815" y2="295" stroke="#26729b" stroke-width="3"/><line x1="815" y1="295" x2="804.4690092573155" y2="300.75310646325045" stroke="#26729b" stroke-width="3"/><line x1="815" y1="295" x2="804.4690092573155" y2="289.24689353674955" stroke="#26729b" stroke-width="3"/><text x="65" y="385" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Beide Erwartungen müssen erfüllt sein; ein Fehlercode allein genügt nicht.</text></g></svg>
