<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Ereignisprotokoll und mögliche Abweichung</title><desc id="desc">Fall 1: Eingang 9:00, Prüfung 9:05, Versand 10:00. Fall 2: Eingang 9:10, kein Prüfeintrag, Versand 9:40. Fehlendes Ereignis ist kein Beweis einer Regelverletzung.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Ereignisprotokoll und mögliche Abweichung</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Zeitachse: zwei Auftragsfälle, obligatorische Prüfung angenommen</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><line x1="190.0" y1="145" x2="190.0" y2="333" stroke="#d9dfe3" stroke-width="1"/><text x="190.0" y="363" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">9:00</text><line x1="335.0" y1="145" x2="335.0" y2="333" stroke="#d9dfe3" stroke-width="1"/><text x="335.0" y="363" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">9:10</text><line x1="480.0" y1="145" x2="480.0" y2="333" stroke="#d9dfe3" stroke-width="1"/><text x="480.0" y="363" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">9:20</text><line x1="625.0" y1="145" x2="625.0" y2="333" stroke="#d9dfe3" stroke-width="1"/><text x="625.0" y="363" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">9:30</text><line x1="770.0" y1="145" x2="770.0" y2="333" stroke="#d9dfe3" stroke-width="1"/><text x="770.0" y="363" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">9:40</text><line x1="915.0" y1="145" x2="915.0" y2="333" stroke="#d9dfe3" stroke-width="1"/><text x="915.0" y="363" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">9:50</text><line x1="1060.0" y1="145" x2="1060.0" y2="333" stroke="#d9dfe3" stroke-width="1"/><text x="1060.0" y="363" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">10:00</text><text x="148" y="216" font-size="21" text-anchor="end" fill="#23272b" font-weight="normal">Fall 1</text><line x1="190.0" y1="210" x2="1060.0" y2="210" stroke="#26729b" stroke-width="3"/><circle cx="190.0" cy="210" r="7" fill="#26729b"/><text x="190.0" y="193" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">Eingang</text><circle cx="262.5" cy="210" r="7" fill="#26729b"/><text x="262.5" y="238" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">Prüfung</text><circle cx="1060.0" cy="210" r="7" fill="#26729b"/><text x="1060.0" y="193" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">Versand</text><text x="148" y="306" font-size="21" text-anchor="end" fill="#23272b" font-weight="normal">Fall 2</text><line x1="335.0" y1="300" x2="770.0" y2="300" stroke="#26729b" stroke-width="3"/><circle cx="335.0" cy="300" r="7" fill="#26729b"/><text x="335.0" y="283" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">Eingang</text><circle cx="770.0" cy="300" r="7" fill="#26729b"/><text x="770.0" y="328" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">Versand</text><text x="552.5" y="257" font-size="19" text-anchor="middle" fill="#98572b" font-weight="bold">Prüfeintrag fehlt</text><text x="55" y="401" font-size="19" text-anchor="start" fill="#23272b" font-weight="normal">Quelllog und alternative Prüfnachweise kontrollieren.</text></g></svg>
