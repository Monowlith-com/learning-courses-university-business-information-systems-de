<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Relationales Bestellschema</title><desc id="desc">Kunde und Bestellung über KundenID verbunden; Position verbindet Bestellung und Artikel, Menge und Preis stehen in Position.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Relationales Bestellschema</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">PK = Primärschlüssel; FK = Fremdschlüssel; 1:n = Beziehung</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="50" y="156" width="235" height="170" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="167.5" y="222.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Kunde</text><text x="167.5" y="248.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">PK: customer_id</text><text x="167.5" y="274.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">name</text><rect x="335" y="156" width="235" height="170" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="452.5" y="222.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Bestellung</text><text x="452.5" y="248.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">PK: order_id</text><text x="452.5" y="274.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">FK: customer_id</text><rect x="620" y="156" width="235" height="170" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="737.5" y="196.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Position</text><text x="737.5" y="222.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">PK: line_id</text><text x="737.5" y="248.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">FK: order_id</text><text x="737.5" y="274.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">FK: product_id</text><text x="737.5" y="300.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">qty, price</text><rect x="905" y="156" width="235" height="170" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="1022.5" y="222.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Artikel</text><text x="1022.5" y="248.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">PK: product_id</text><text x="1022.5" y="274.0" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">name</text><line x1="285" y1="240" x2="335" y2="240" stroke="#26729b" stroke-width="3"/><text x="310" y="226" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">1:n</text><line x1="570" y1="240" x2="620" y2="240" stroke="#26729b" stroke-width="3"/><text x="595" y="226" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">1:n</text><line x1="855" y1="240" x2="905" y2="240" stroke="#26729b" stroke-width="3"/><text x="880" y="226" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">n:1</text><text x="50" y="375" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Jede Position verweist auf genau eine Bestellung und einen Artikel (FK NOT NULL).</text></g></svg>
