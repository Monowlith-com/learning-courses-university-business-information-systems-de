<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Partnerökosystem einer Bestands-API</title><desc id="desc">Händler stellt Bestandsdaten über eine API bereit; Partner liefern Lieferoptionen zurück. Verträge, Zugriffsregeln, Datenqualität und Eskalation bilden die Governance.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Partnerökosystem einer Bestands-API</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Beispiel: Händler und externe Lieferanbieter</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="55" y="163" width="300" height="108" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="205.0" y="211.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Händler</text><text x="205.0" y="235.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Bestandssystem</text><line x1="355" y1="190" x2="460" y2="190" stroke="#26729b" stroke-width="3"/><line x1="460" y1="190" x2="450.3465918192059" y2="195.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="460" y1="190" x2="450.3465918192059" y2="184.72631907535376" stroke="#26729b" stroke-width="3"/><line x1="460" y1="244" x2="355" y2="244" stroke="#26729b" stroke-width="3"/><line x1="355" y1="244" x2="364.6534081807941" y2="238.72631907535376" stroke="#26729b" stroke-width="3"/><line x1="355" y1="244" x2="364.6534081807941" y2="249.27368092464624" stroke="#26729b" stroke-width="3"/><rect x="460" y="163" width="280" height="108" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="600.0" y="211.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Bestands-API</text><text x="600.0" y="235.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Versionierter Vertrag</text><line x1="740" y1="190" x2="845" y2="190" stroke="#26729b" stroke-width="3"/><line x1="845" y1="190" x2="835.3465918192059" y2="195.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="845" y1="190" x2="835.3465918192059" y2="184.72631907535376" stroke="#26729b" stroke-width="3"/><line x1="845" y1="244" x2="740" y2="244" stroke="#26729b" stroke-width="3"/><line x1="740" y1="244" x2="749.6534081807941" y2="238.72631907535376" stroke="#26729b" stroke-width="3"/><line x1="740" y1="244" x2="749.6534081807941" y2="249.27368092464624" stroke="#26729b" stroke-width="3"/><rect x="845" y="163" width="300" height="108" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="995.0" y="211.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Lieferpartner</text><text x="995.0" y="235.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Lieferoptionen</text><text x="55" y="140" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Bestandsinformationen →</text><text x="1145" y="295" font-size="20" text-anchor="end" fill="#23272b" font-weight="normal">← Lieferoptionen</text><rect x="55" y="326" width="1090" height="58" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="600.0" y="361.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Governance: Zugriffsrechte · Datenqualität · Verfügbarkeit · Eskalation</text></g></svg>
