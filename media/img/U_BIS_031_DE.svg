<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Granularität bestimmt die Kennzahl</title><desc id="desc">Drei Positionen mit 20, 30 und 100 Euro gehören zu zwei Aufträgen: Positionsmittel 50 Euro, Auftragsmittel 75 Euro.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Granularität bestimmt die Kennzahl</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Fakten: eine Zeile je Bestellposition</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="65" y="143" width="290" height="60" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="210.0" y="167.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Auftrag 1: Position A</text><text x="210.0" y="191.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">20 EUR</text><rect x="65" y="215" width="290" height="60" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="210.0" y="239.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Auftrag 1: Position B</text><text x="210.0" y="263.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">30 EUR</text><rect x="65" y="287" width="290" height="60" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="210.0" y="311.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Auftrag 2: Position A</text><text x="210.0" y="335.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">100 EUR</text><line x1="355" y1="173" x2="485" y2="202" stroke="#26729b" stroke-width="3"/><line x1="485" y1="202" x2="474.4299623794861" y2="205.04537431211998" stroke="#26729b" stroke-width="3"/><line x1="485" y1="202" x2="476.7263901789951" y2="194.75104279707966" stroke="#26729b" stroke-width="3"/><line x1="355" y1="245" x2="485" y2="202" stroke="#26729b" stroke-width="3"/><line x1="485" y1="202" x2="477.4910727977476" y2="210.03840856583406" stroke="#26729b" stroke-width="3"/><line x1="485" y1="202" x2="474.17882174584645" y2="200.02462631590024" stroke="#26729b" stroke-width="3"/><line x1="355" y1="317" x2="485" y2="317" stroke="#26729b" stroke-width="3"/><line x1="485" y1="317" x2="475.3465918192059" y2="322.2736809246462" stroke="#26729b" stroke-width="3"/><line x1="485" y1="317" x2="475.3465918192059" y2="311.7263190753538" stroke="#26729b" stroke-width="3"/><rect x="485" y="167" width="280" height="70" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="625.0" y="196.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Auftrag 1</text><text x="625.0" y="220.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">50 EUR</text><rect x="485" y="282" width="280" height="70" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="625.0" y="311.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Auftrag 2</text><text x="625.0" y="335.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">100 EUR</text><line x1="765" y1="202" x2="850" y2="240" stroke="#26729b" stroke-width="3"/><line x1="850" y1="240" x2="839.034825802803" y2="240.8746169590875" stroke="#26729b" stroke-width="3"/><line x1="850" y1="240" x2="843.3395263031156" y2="231.24568162944078" stroke="#26729b" stroke-width="3"/><line x1="765" y1="317" x2="850" y2="260" stroke="#26729b" stroke-width="3"/><line x1="850" y1="260" x2="844.9196124034754" y2="269.75651894217805" stroke="#26729b" stroke-width="3"/><line x1="850" y1="260" x2="839.0452272643224" y2="260.9964709276516" stroke="#26729b" stroke-width="3"/><rect x="850" y="207" width="295" height="90" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="997.5" y="246.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Auftragsmittel</text><text x="997.5" y="270.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">150 / 2 = 75 EUR</text><text x="65" y="390" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Positionsmittel: 150 / 3 = 50 EUR (andere Fragestellung).</text></g></svg>
