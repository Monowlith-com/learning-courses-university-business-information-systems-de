<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Konfusionsmatrix und Fehlerkosten</title><desc id="desc">Modell B: 15 richtig positive, 5 falsch negative, 45 falsch positive, 935 richtig negative Klassifikationen</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Konfusionsmatrix und Fehlerkosten</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Fallstudie: 1.000 Aufträge, davon 20 fehlerhaft</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="420" y="145" font-size="21" text-anchor="middle" fill="#23272b" font-weight="normal">Vorhersage</text><text x="320" y="178" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Fehler</text><text x="540" y="178" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Kein Fehler</text><text x="192" y="231" font-size="20" text-anchor="end" fill="#23272b" font-weight="normal">Fehler</text><text x="192" y="316" font-size="20" text-anchor="end" fill="#23272b" font-weight="normal">Kein Fehler</text><text x="48" y="170" font-size="18" text-anchor="start" fill="#23272b" font-weight="normal">Tatsächlich</text><rect x="220" y="190" width="200" height="74" fill="#e5f2e8" stroke="#9ba6ad" stroke-width="2"/><text x="320" y="223" font-size="27" text-anchor="middle" fill="#23272b" font-weight="bold">15</text><text x="320" y="249" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">TP</text><rect x="440" y="190" width="200" height="74" fill="#f8e8de" stroke="#9ba6ad" stroke-width="2"/><text x="540" y="223" font-size="27" text-anchor="middle" fill="#23272b" font-weight="bold">5</text><text x="540" y="249" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">FN</text><rect x="220" y="275" width="200" height="74" fill="#f8e8de" stroke="#9ba6ad" stroke-width="2"/><text x="320" y="308" font-size="27" text-anchor="middle" fill="#23272b" font-weight="bold">45</text><text x="320" y="334" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">FP</text><rect x="440" y="275" width="200" height="74" fill="#e5f2e8" stroke="#9ba6ad" stroke-width="2"/><text x="540" y="308" font-size="27" text-anchor="middle" fill="#23272b" font-weight="bold">935</text><text x="540" y="334" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">TN</text><text x="710" y="180" font-size="22" text-anchor="start" fill="#23272b" font-weight="normal">Accuracy = 95%</text><text x="710" y="222" font-size="22" text-anchor="start" fill="#23272b" font-weight="normal">Recall = 75%</text><text x="710" y="264" font-size="22" text-anchor="start" fill="#23272b" font-weight="normal">Precision = 25%</text><text x="710" y="315" font-size="22" text-anchor="start" fill="#23272b" font-weight="bold">Kosten: 5 × 100 + 45 × 5 = 725 €</text></g></svg>
