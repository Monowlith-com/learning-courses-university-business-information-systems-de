<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Doppelzählung durch Join vor Aggregation</title><desc id="desc">Zwei Positionen und zwei Zahlungen für Auftrag 1 erzeugen vier Join-Zeilen. Falsche Gesamtsumme 250 Euro statt 150 Euro.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Doppelzählung durch Join vor Aggregation</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Bestellung 1: Positionen 30 + 70; Zahlungen 40 + 60 EUR</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="70" y="147" font-size="23" text-anchor="start" fill="#23272b" font-weight="bold">Falscher Join</text><text x="70" y="183" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Position / Zahlung [EUR]</text><rect x="70" y="195" width="420" height="37" fill="#f8ece5" stroke="#fff" stroke-width="2"/><text x="175" y="220" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">30</text><text x="385" y="220" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">40</text><rect x="70" y="234" width="420" height="37" fill="#f8ece5" stroke="#fff" stroke-width="2"/><text x="175" y="259" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">30</text><text x="385" y="259" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">60</text><rect x="70" y="273" width="420" height="37" fill="#f8ece5" stroke="#fff" stroke-width="2"/><text x="175" y="298" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">70</text><text x="385" y="298" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">40</text><rect x="70" y="312" width="420" height="37" fill="#f8ece5" stroke="#fff" stroke-width="2"/><text x="175" y="337" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">70</text><text x="385" y="337" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">60</text><text x="70" y="382" font-size="21" text-anchor="start" fill="#23272b" font-weight="bold">200 + 50 = 250 EUR (falsch)</text><line x1="575" y1="140" x2="575" y2="385" stroke="#b8bfc6" stroke-width="2"/><text x="640" y="147" font-size="23" text-anchor="start" fill="#23272b" font-weight="bold">Erst je Auftrag aggregieren</text><rect x="640" y="181" width="235" height="72" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="757.5" y="211.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Positionen</text><text x="757.5" y="235.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">30 + 70 = 100</text><rect x="915" y="181" width="220" height="72" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="1025.0" y="211.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Zahlungen</text><text x="1025.0" y="235.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">40 + 60 = 100</text><line x1="757" y1="253" x2="847" y2="290" stroke="#26729b" stroke-width="3"/><line x1="847" y1="290" x2="836.0664248849043" y2="291.20703570890043" stroke="#26729b" stroke-width="3"/><line x1="847" y1="290" x2="840.0768786272646" y2="281.4518779572134" stroke="#26729b" stroke-width="3"/><line x1="1025" y1="253" x2="935" y2="290" stroke="#26729b" stroke-width="3"/><line x1="935" y1="290" x2="941.9231213727354" y2="281.4518779572134" stroke="#26729b" stroke-width="3"/><line x1="935" y1="290" x2="945.9335751150957" y2="291.20703570890043" stroke="#26729b" stroke-width="3"/><rect x="745" y="290" width="295" height="55" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="892.5" y="323.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Auftrag 1: 100 EUR</text><text x="640" y="382" font-size="21" text-anchor="start" fill="#23272b" font-weight="bold">100 + 50 = 150 EUR (korrekt)</text></g></svg>
