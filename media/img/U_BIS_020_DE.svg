<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Durchlaufzeit und Bearbeitungszeit</title><desc id="desc">60 Minuten insgesamt: 5 prüfen, 40 warten, 15 verpacken; nach Halbierung der Wartezeit 40 Minuten</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Durchlaufzeit und Bearbeitungszeit</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Zeitanteile einer Bestellung; Vergleich bei unveränderten Bearbeitungszeiten</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="150" y="193" font-size="22" text-anchor="end" fill="#23272b" font-weight="normal">Ist</text><rect x="180" y="155" width="65" height="60" fill="#26729b" stroke="#fff" stroke-width="2"/><text x="212.5" y="193" font-size="22" text-anchor="middle" fill="#fff" font-weight="normal">5</text><rect x="245" y="155" width="520" height="60" fill="#d0d6dc" stroke="#fff" stroke-width="2"/><text x="505.0" y="193" font-size="22" text-anchor="middle" fill="#23272b" font-weight="normal">40</text><rect x="765" y="155" width="195" height="60" fill="#47765f" stroke="#fff" stroke-width="2"/><text x="862.5" y="193" font-size="22" text-anchor="middle" fill="#fff" font-weight="normal">15</text><text x="974" y="193" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">60 min</text><text x="150" y="287" font-size="22" text-anchor="end" fill="#23272b" font-weight="normal">Ziel</text><rect x="180" y="249" width="65" height="60" fill="#26729b" stroke="#fff" stroke-width="2"/><text x="212.5" y="287" font-size="22" text-anchor="middle" fill="#fff" font-weight="normal">5</text><rect x="245" y="249" width="260" height="60" fill="#d0d6dc" stroke="#fff" stroke-width="2"/><text x="375.0" y="287" font-size="22" text-anchor="middle" fill="#23272b" font-weight="normal">20</text><rect x="505" y="249" width="195" height="60" fill="#47765f" stroke="#fff" stroke-width="2"/><text x="602.5" y="287" font-size="22" text-anchor="middle" fill="#fff" font-weight="normal">15</text><text x="714" y="287" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">40 min</text><rect x="180" y="351" width="26" height="22" fill="#26729b" stroke="#26729b" stroke-width="2"/><text x="218" y="370" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Prüfung</text><rect x="420" y="351" width="26" height="22" fill="#d0d6dc" stroke="#d0d6dc" stroke-width="2"/><text x="458" y="370" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Warten</text><rect x="660" y="351" width="26" height="22" fill="#47765f" stroke="#47765f" stroke-width="2"/><text x="698" y="370" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Packen</text></g></svg>
