<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Bestandsabweichung im Informationssystem</title><desc id="desc">Bestands-App meldet 20 Stück, physische Zählung ergibt 15. Fünf Stück Differenz müssen vor einer Korrektur anhand der Buchungen untersucht werden.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Bestandsabweichung im Informationssystem</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Ersatzteillager: technische und organisatorische Ursachen unterscheiden</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="55" y="155" width="300" height="100" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="205.0" y="199.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Datenbank / App</text><text x="205.0" y="223.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">20 Stück</text><rect x="845" y="155" width="300" height="100" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="995.0" y="199.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Physischer Bestand</text><text x="995.0" y="223.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">15 Stück</text><line x1="355" y1="205" x2="445" y2="205" stroke="#26729b" stroke-width="3"/><line x1="445" y1="205" x2="435.3465918192059" y2="210.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="445" y1="205" x2="435.3465918192059" y2="199.72631907535376" stroke="#26729b" stroke-width="3"/><line x1="845" y1="205" x2="755" y2="205" stroke="#26729b" stroke-width="3"/><line x1="755" y1="205" x2="764.6534081807941" y2="199.72631907535376" stroke="#26729b" stroke-width="3"/><line x1="755" y1="205" x2="764.6534081807941" y2="210.27368092464624" stroke="#26729b" stroke-width="3"/><rect x="445" y="155" width="310" height="100" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="600.0" y="199.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Soll-Ist-Abgleich</text><text x="600.0" y="223.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Differenz: 5 Stück</text><line x1="600" y1="255" x2="600" y2="290" stroke="#26729b" stroke-width="3"/><line x1="600" y1="290" x2="594.7263190753538" y2="280.3465918192059" stroke="#26729b" stroke-width="3"/><line x1="600" y1="290" x2="605.2736809246462" y2="280.3465918192059" stroke="#26729b" stroke-width="3"/><rect x="280" y="290" width="640" height="78" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="600.0" y="323.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Buchungsprotokoll + zuständige Rolle prüfen</text><text x="600.0" y="347.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Ursache noch nicht bewiesen</text></g></svg>
