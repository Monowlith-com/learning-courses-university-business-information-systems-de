<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Abwanderung und vereinfachter Lifetime Value</title><desc id="desc">Bei 18 Euro monatlichem Deckungsbeitrag beträgt der erwartete Beitrag vor CAC 360 Euro bei 5 Prozent Churn und 180 Euro bei 10 Prozent.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Abwanderung und vereinfachter Lifetime Value</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">18 EUR pro bezahltem Monat; konstante Abwanderung, keine Diskontierung</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="160" y="190" font-size="23" text-anchor="end" fill="#23272b" font-weight="normal">5%</text><rect x="185" y="155" width="720" height="55" fill="#26729b" stroke="#26729b" stroke-width="2"/><text x="915" y="191" font-size="23" text-anchor="start" fill="#23272b" font-weight="normal">360 EUR</text><text x="160" y="280" font-size="23" text-anchor="end" fill="#23272b" font-weight="normal">10%</text><rect x="185" y="245" width="360" height="55" fill="#26729b" stroke="#26729b" stroke-width="2"/><text x="555" y="281" font-size="23" text-anchor="start" fill="#23272b" font-weight="normal">180 EUR</text><line x1="485" y1="140" x2="485" y2="330" stroke="#98572b" stroke-width="3" stroke-dasharray="7 5"/><text x="485" y="357" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">CAC = 150 EUR</text><text x="185" y="395" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Nach CAC: 210 EUR bzw. 30 EUR; keine Unternehmensbewertung.</text></g></svg>
