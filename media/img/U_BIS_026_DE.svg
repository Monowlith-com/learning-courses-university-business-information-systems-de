<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Gebrauchstauglichkeit: zwei Zielgrößen</title><desc id="desc">Aufgabenerfolg sinkt von 90 auf 80 Prozent; Dauer erfolgreicher Aufgaben sinkt von 100 auf 70 Sekunden.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Gebrauchstauglichkeit: zwei Zielgrößen</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Zehn Aufgaben pro Variante; keine belastbare Wirkungsschätzung</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="60" y="152" font-size="23" text-anchor="start" fill="#23272b" font-weight="bold">Aufgabenerfolg</text><text x="60" y="207" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Alt</text><rect x="135" y="181" width="333.0" height="42" fill="#9eabb6" stroke="#9eabb6" stroke-width="2"/><text x="478.0" y="209" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">90%</text><text x="60" y="287" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Neu</text><rect x="135" y="261" width="296.0" height="42" fill="#26729b" stroke="#26729b" stroke-width="2"/><text x="441.0" y="289" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">80%</text><text x="640" y="152" font-size="23" text-anchor="start" fill="#23272b" font-weight="bold">Zeit erfolgreicher Aufgaben</text><text x="640" y="207" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Alt</text><rect x="715" y="181" width="370.0" height="42" fill="#9eabb6" stroke="#9eabb6" stroke-width="2"/><text x="1095.0" y="209" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">100 s</text><text x="640" y="287" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Neu</text><rect x="715" y="261" width="259.0" height="42" fill="#26729b" stroke="#26729b" stroke-width="2"/><text x="984.0" y="289" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">70 s</text><line x1="600" y1="135" x2="600" y2="350" stroke="#b8bfc6" stroke-width="2"/><text x="60" y="383" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">Schneller bei Erfolg, aber häufiger erfolglos. Beide Maße getrennt bewerten.</text></g></svg>
