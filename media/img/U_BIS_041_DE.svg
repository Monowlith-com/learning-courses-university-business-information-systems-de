<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Selektionsverzerrung beim Filialpilot</title><desc id="desc">Leistungsfähige Filialen werden bevorzugt für den Pilot ausgewählt. Ausgangsleistung kann sowohl Auswahl als auch späteren Umsatz beeinflussen; die beobachtete Differenz ist kein isolierter Systemeffekt.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Selektionsverzerrung beim Filialpilot</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Mögliche kausale Beziehungen; keine geschätzten Effekte</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="430" y="135" width="340" height="70" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="600.0" y="176.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Ausgangsleistung</text><line x1="510" y1="205" x2="280" y2="265" stroke="#26729b" stroke-width="3"/><line x1="280" y1="265" x2="288.0096119492862" y2="257.4603636412721" stroke="#26729b" stroke-width="3"/><line x1="280" y1="265" x2="290.6719970371805" y2="267.666173144867" stroke="#26729b" stroke-width="3"/><line x1="690" y1="205" x2="920" y2="265" stroke="#26729b" stroke-width="3"/><line x1="920" y1="265" x2="909.3280029628195" y2="267.666173144867" stroke="#26729b" stroke-width="3"/><line x1="920" y1="265" x2="911.9903880507138" y2="257.4603636412721" stroke="#26729b" stroke-width="3"/><rect x="90" y="265" width="380" height="70" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="280.0" y="306.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Auswahl für Pilot</text><rect x="730" y="265" width="380" height="70" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="920.0" y="306.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Späterer Umsatz</text><line x1="470" y1="300" x2="730" y2="300" stroke="#26729b" stroke-width="3"/><line x1="730" y1="300" x2="720.3465918192059" y2="305.2736809246462" stroke="#26729b" stroke-width="3"/><line x1="730" y1="300" x2="720.3465918192059" y2="294.7263190753538" stroke="#26729b" stroke-width="3"/><text x="600" y="285" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Systemeffekt?</text><text x="55" y="390" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">Vergleichsgruppe und Zuweisungsverfahren vorab festlegen.</text></g></svg>
