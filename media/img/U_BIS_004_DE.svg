<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Kapitalwert einer IT-Investition</title><desc id="desc">Zahlungsstrom: heute −1.000 Euro, in einem Jahr +1.150 Euro; Barwert 1.045,45 Euro, Kapitalwert 45,45 Euro</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Kapitalwert einer IT-Investition</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Ein Jahr, Kalkulationszins 10 %</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><line x1="155" y1="239" x2="760" y2="239" stroke="#64727e" stroke-width="3"/><circle cx="240" cy="239" r="7" fill="#26729b"/><circle cx="680" cy="239" r="7" fill="#26729b"/><text x="240" y="222" font-size="21" text-anchor="middle" fill="#23272b" font-weight="normal">Heute (t = 0)</text><text x="680" y="270" font-size="21" text-anchor="middle" fill="#23272b" font-weight="normal">Jahr 1 (t = 1)</text><line x1="240" y1="247" x2="240" y2="321" stroke="#98572b" stroke-width="4"/><text x="240" y="355" font-size="24" text-anchor="middle" fill="#23272b" font-weight="normal">−1 000 EUR</text><line x1="680" y1="231" x2="680" y2="158" stroke="#26729b" stroke-width="4"/><text x="680" y="148" font-size="24" text-anchor="middle" fill="#23272b" font-weight="normal">+1 150 EUR</text><line x1="640" y1="178" x2="280" y2="178" stroke="#26729b" stroke-width="2" stroke-dasharray="7 4"/><text x="460" y="165" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">÷ 1,10</text><rect x="825" y="146" width="320" height="210" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="850" y="190" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Barwert des Rückflusses</text><text x="850" y="228" font-size="27" text-anchor="start" fill="#23272b" font-weight="bold">1045,45 EUR</text><text x="850" y="282" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">Kapitalwert</text><text x="850" y="322" font-size="27" text-anchor="start" fill="#23272b" font-weight="bold">45,45 EUR</text></g></svg>
