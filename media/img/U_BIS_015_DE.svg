<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Latenzbudget einer Webanfrage</title><desc id="desc">Browser sendet HTTP-Anfrage an Anwendung; Anwendung fragt Datenbank ab. Beispielzeiten: 20 ms Netz, 30 ms Anwendung, 150 ms Datenbank, insgesamt 200 ms ohne weitere Wartezeiten.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Latenzbudget einer Webanfrage</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Vereinfachte sequenzielle Messung, frei gewählte Beispielwerte</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="60" y="135" width="275" height="75" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="197.5" y="179.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Browser</text><line x1="335" y1="172" x2="465" y2="172" stroke="#26729b" stroke-width="3"/><line x1="465" y1="172" x2="454.4690092573155" y2="177.75310646325045" stroke="#26729b" stroke-width="3"/><line x1="465" y1="172" x2="454.4690092573155" y2="166.24689353674955" stroke="#26729b" stroke-width="3"/><rect x="465" y="135" width="270" height="75" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="600.0" y="179.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Anwendung</text><line x1="735" y1="172" x2="865" y2="172" stroke="#26729b" stroke-width="3"/><line x1="865" y1="172" x2="854.4690092573155" y2="177.75310646325045" stroke="#26729b" stroke-width="3"/><line x1="865" y1="172" x2="854.4690092573155" y2="166.24689353674955" stroke="#26729b" stroke-width="3"/><rect x="865" y="135" width="275" height="75" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="1002.5" y="179.5" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">Datenbank</text><rect x="60" y="255" width="104.0" height="55" fill="#a8b8c3" stroke="#fff" stroke-width="2"/><text x="112.0" y="290" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">20 ms</text><text x="112.0" y="339" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">Netz</text><rect x="164.0" y="255" width="156.0" height="55" fill="#47765f" stroke="#fff" stroke-width="2"/><text x="242.0" y="290" font-size="19" text-anchor="middle" fill="#fff" font-weight="normal">30 ms</text><text x="242.0" y="339" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">App</text><rect x="320.0" y="255" width="780.0" height="55" fill="#26729b" stroke="#fff" stroke-width="2"/><text x="710.0" y="290" font-size="19" text-anchor="middle" fill="#fff" font-weight="normal">150 ms</text><text x="710.0" y="339" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">Datenbank</text><text x="60" y="385" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">20 + 30 + 150 = 200 ms; Zeiten ohne Überlappung oder doppelte Zählung.</text></g></svg>
