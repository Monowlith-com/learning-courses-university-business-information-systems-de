<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Erwartungswert eines Auftrags</title><desc id="desc">80 Prozent mit +100 Euro, 20 Prozent mit −50 Euro; Erwartungswert +70 Euro</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Erwartungswert eines Auftrags</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Zwei mögliche Ergebnisse; keine garantierte Einzelzahlung</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="65" y="200" width="190" height="80" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="160" y="248" font-size="24" text-anchor="middle" fill="#23272b" font-weight="normal">Auftrag</text><line x1="255" y1="240" x2="410" y2="175" stroke="#67717b" stroke-width="2"/><line x1="255" y1="240" x2="410" y2="305" stroke="#67717b" stroke-width="2"/><text x="330" y="187" font-size="22" text-anchor="middle" fill="#23272b" font-weight="normal">80 %</text><text x="330" y="310" font-size="22" text-anchor="middle" fill="#23272b" font-weight="normal">20 %</text><rect x="410" y="135" width="230" height="80" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="525" y="183" font-size="25" text-anchor="middle" fill="#23272b" font-weight="normal">+100 EUR</text><rect x="410" y="265" width="230" height="80" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="525" y="313" font-size="25" text-anchor="middle" fill="#23272b" font-weight="normal">−50 EUR</text><text x="705" y="174" font-size="23" text-anchor="start" fill="#23272b" font-weight="normal">0,8 × 100 = 80</text><text x="705" y="306" font-size="23" text-anchor="start" fill="#23272b" font-weight="normal">0,2 × (−50) = −10</text><rect x="950" y="195" width="200" height="85" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="1050" y="224" font-size="21" text-anchor="middle" fill="#23272b" font-weight="normal">E(X)</text><text x="1050" y="260" font-size="26" text-anchor="middle" fill="#23272b" font-weight="bold">+70 EUR</text></g></svg>
