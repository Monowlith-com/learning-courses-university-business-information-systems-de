<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Fehlerbudget: 30-Tage-Fenster</title><desc id="desc">Fehlerbudget 43,2 Minuten; Ausfälle 25 und 30 Minuten; Budget um 11,8 Minuten überschritten.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Fehlerbudget: 30-Tage-Fenster</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Zeitbasiertes SLO 99,9 %; keine Ausschlüsse</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="90" y="220" width="425" height="65" fill="#26729b" stroke="#fff" stroke-width="2"/><text x="302.5" y="247" font-size="20" text-anchor="middle" fill="#fff" font-weight="normal">Ausfall 1</text><text x="302.5" y="273" font-size="20" text-anchor="middle" fill="#fff" font-weight="normal">25 min</text><rect x="515" y="220" width="510" height="65" fill="#98572b" stroke="#fff" stroke-width="2"/><text x="770.0" y="247" font-size="20" text-anchor="middle" fill="#fff" font-weight="normal">Ausfall 2</text><text x="770.0" y="273" font-size="20" text-anchor="middle" fill="#fff" font-weight="normal">30 min</text><line x1="824.4000000000001" y1="175" x2="824.4000000000001" y2="315" stroke="#23272b" stroke-width="3" stroke-dasharray="6 4"/><text x="824.4000000000001" y="163" font-size="23" text-anchor="middle" fill="#23272b" font-weight="normal">Budget: 43,2 min</text><line x1="824.4000000000001" y1="322" x2="1025" y2="322" stroke="#67717b" stroke-width="2"/><text x="924.7" y="351" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">11,8 min zu viel</text><text x="90" y="385" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">43.200 min × 0,001 = 43,2 min; Ist-Verfügbarkeit ≈ 99,8727 %</text></g></svg>
