<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Warteschlange an einer Station</title><desc id="desc">Auftrag 1 bearbeitet Minute 0 bis 5; Auftrag 2 wartet von Minute 2 bis 5 und wird von 5 bis 10 bearbeitet.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Warteschlange an einer Station</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Zwei Aufträge, fünf Minuten Bearbeitung je Auftrag, FIFO</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><line x1="175" y1="145" x2="175" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="175" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">0</text><line x1="260" y1="145" x2="260" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="260" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">1</text><line x1="345" y1="145" x2="345" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="345" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">2</text><line x1="430" y1="145" x2="430" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="430" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">3</text><line x1="515" y1="145" x2="515" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="515" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">4</text><line x1="600" y1="145" x2="600" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="600" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">5</text><line x1="685" y1="145" x2="685" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="685" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">6</text><line x1="770" y1="145" x2="770" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="770" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">7</text><line x1="855" y1="145" x2="855" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="855" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">8</text><line x1="940" y1="145" x2="940" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="940" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">9</text><line x1="1025" y1="145" x2="1025" y2="340" stroke="#d9dfe3" stroke-width="1"/><text x="1025" y="365" font-size="18" text-anchor="middle" fill="#23272b" font-weight="normal">10</text><text x="150" y="206" font-size="20" text-anchor="end" fill="#23272b" font-weight="normal">Auftrag 1</text><text x="150" y="301" font-size="20" text-anchor="end" fill="#23272b" font-weight="normal">Auftrag 2</text><rect x="175" y="170" width="425" height="54" fill="#26729b" stroke="#fff" stroke-width="2"/><text x="387.5" y="204" font-size="20" text-anchor="middle" fill="#fff" font-weight="normal">Bearbeitung 5 min</text><rect x="345" y="265" width="255" height="54" fill="#d0d6dc" stroke="#fff" stroke-width="2"/><text x="472.5" y="299" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Warten 3 min</text><rect x="600" y="265" width="425" height="54" fill="#26729b" stroke="#fff" stroke-width="2"/><text x="812.5" y="299" font-size="20" text-anchor="middle" fill="#fff" font-weight="normal">Bearbeitung 5 min</text><text x="1100" y="365" font-size="18" text-anchor="start" fill="#23272b" font-weight="normal">min</text><text x="175" y="402" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Mittlere Wartezeit: (0 + 3) / 2 = 1,5 min</text></g></svg>
