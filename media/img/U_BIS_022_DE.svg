<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Ereignisverarbeitung mit Deduplizierung</title><desc id="desc">Dieselbe Ereignis-ID wird zweimal geliefert; atomare Verarbeitung reserviert einmal und erkennt das Duplikat.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Ereignisverarbeitung mit Deduplizierung</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Beispiel: OrderCreated, Ereignis-ID E42</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="65" y="147" width="220" height="74" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="175.0" y="178.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">ERP</text><text x="175.0" y="202.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">E42</text><line x1="285" y1="184" x2="350" y2="184" stroke="#26729b" stroke-width="3"/><line x1="350" y1="184" x2="340.3465918192059" y2="189.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="350" y1="184" x2="340.3465918192059" y2="178.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="350" y="147" width="240" height="74" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="470.0" y="178.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Zustellung 1</text><text x="470.0" y="202.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">E42</text><line x1="590" y1="184" x2="655" y2="184" stroke="#26729b" stroke-width="3"/><line x1="655" y1="184" x2="645.3465918192059" y2="189.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="655" y1="184" x2="645.3465918192059" y2="178.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="655" y="138" width="480" height="92" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="895.0" y="178.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Atomare Transaktion</text><text x="895.0" y="202.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">ID E42 speichern + 1 reservieren</text><rect x="350" y="274" width="240" height="74" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="470.0" y="305.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Erneute Zustellung</text><text x="470.0" y="329.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">E42</text><line x1="590" y1="311" x2="655" y2="311" stroke="#26729b" stroke-width="3"/><line x1="655" y1="311" x2="645.3465918192059" y2="316.2736809246462" stroke="#26729b" stroke-width="3"/><line x1="655" y1="311" x2="645.3465918192059" y2="305.7263190753538" stroke="#26729b" stroke-width="3"/><rect x="655" y="265" width="480" height="92" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="895.0" y="305.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">ID E42 bereits vorhanden</text><text x="895.0" y="329.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Keine zweite Reservierung</text><line x1="175" y1="221" x2="175" y2="311" stroke="#67717b" stroke-width="2"/><line x1="175" y1="311" x2="350" y2="311" stroke="#26729b" stroke-width="3"/><line x1="350" y1="311" x2="340.3465918192059" y2="316.2736809246462" stroke="#26729b" stroke-width="3"/><line x1="350" y1="311" x2="340.3465918192059" y2="305.7263190753538" stroke="#26729b" stroke-width="3"/><text x="65" y="390" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Die fachliche Wirkung bleibt 1; die Zustellzahl ist 2.</text></g></svg>
