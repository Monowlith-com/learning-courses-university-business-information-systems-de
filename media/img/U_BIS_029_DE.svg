<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Deckungsbeitrag eines Reparaturmarktplatzes</title><desc id="desc">Bei 2.000 Aufträgen und 5 Euro Gebühr entstehen 10.000 Euro Erlös, 4.000 Euro variable Kosten und 6.000 Euro Deckungsbeitrag.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Deckungsbeitrag eines Reparaturmarktplatzes</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">2.000 Aufträge × 5 € Gebühr; 2 € variable Kosten je Auftrag</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="275" y="171" font-size="22" text-anchor="end" fill="#23272b" font-weight="normal">Erlös</text><rect x="300" y="143" width="670.0" height="43" fill="#26729b" stroke="#26729b" stroke-width="2"/><text x="980.0" y="172" font-size="22" text-anchor="start" fill="#23272b" font-weight="normal">10 000 EUR</text><text x="275" y="244" font-size="22" text-anchor="end" fill="#23272b" font-weight="normal">Variable Kosten</text><rect x="300" y="216" width="268.0" height="43" fill="#98572b" stroke="#98572b" stroke-width="2"/><text x="578.0" y="245" font-size="22" text-anchor="start" fill="#23272b" font-weight="normal">4 000 EUR</text><text x="275" y="317" font-size="22" text-anchor="end" fill="#23272b" font-weight="normal">Deckungsbeitrag</text><rect x="300" y="289" width="402.0" height="43" fill="#47765f" stroke="#47765f" stroke-width="2"/><text x="712.0" y="318" font-size="22" text-anchor="start" fill="#23272b" font-weight="normal">6 000 EUR</text><text x="300" y="388" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Vor Fixkosten; keine Aussage über tatsächliche Nachfrage.</text></g></svg>
