<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Datenminimierung im Support</title><desc id="desc">Supportdaten: Produktgruppe und Antwortdauer für Analyse übernehmen; Name, Adresse und Freitext bei fehlendem Bedarf ausschließen; kleine Gruppen prüfen.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Datenminimierung im Support</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Zweck: mittlere Antwortdauer nach Produktgruppe</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="55" y="144" width="340" height="104" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="225.0" y="178.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Rohdaten</text><text x="225.0" y="202.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Name, Adresse, Freitext</text><text x="225.0" y="226.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Kategorie, Zeitpunkte</text><line x1="395" y1="196" x2="465" y2="196" stroke="#26729b" stroke-width="3"/><line x1="465" y1="196" x2="455.3465918192059" y2="201.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="465" y1="196" x2="455.3465918192059" y2="190.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="465" y="144" width="280" height="104" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="605.0" y="190.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Zweckprüfung</text><text x="605.0" y="214.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Nur erforderliche Felder</text><line x1="745" y1="196" x2="815" y2="196" stroke="#26729b" stroke-width="3"/><line x1="815" y1="196" x2="805.3465918192059" y2="201.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="815" y1="196" x2="805.3465918192059" y2="190.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="815" y="144" width="330" height="104" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="980.0" y="178.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Analysebestand</text><text x="980.0" y="202.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Produktgruppe</text><text x="980.0" y="226.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Antwortdauer</text><line x1="605" y1="248" x2="605" y2="282" stroke="#26729b" stroke-width="3"/><line x1="605" y1="282" x2="599.7263190753538" y2="272.3465918192059" stroke="#26729b" stroke-width="3"/><line x1="605" y1="282" x2="610.2736809246462" y2="272.3465918192059" stroke="#26729b" stroke-width="3"/><rect x="385" y="282" width="440" height="62" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="605.0" y="319.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Nicht erforderliche Felder ausschließen</text><text x="600" y="390" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Rechtsgrundlage, Speicherfrist, Zugriff und Rückschlüsse gesondert prüfen.</text></g></svg>
