<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Migration widersprüchlicher Artikelstämme</title><desc id="desc">Drei alte Artikelstämme werden über ID-Mapping und Bereinigung auf eine führende Quelle migriert. Konsumenten testen, dann Freigabe oder Rückkehr.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Migration widersprüchlicher Artikelstämme</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Illustrativer Migrationspfad; keine formale Architekturnotation</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="55" y="142" width="230" height="48" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="170.0" y="172.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Artikelstamm 1</text><line x1="285" y1="166" x2="370" y2="231" stroke="#26729b" stroke-width="3"/><line x1="370" y1="231" x2="359.12824155168965" y2="229.32522591326696" stroke="#26729b" stroke-width="3"/><line x1="370" y1="231" x2="365.5352376416305" y2="220.94684641103666" stroke="#26729b" stroke-width="3"/><rect x="55" y="207" width="230" height="48" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="170.0" y="237.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Artikelstamm 2</text><line x1="285" y1="231" x2="370" y2="231" stroke="#26729b" stroke-width="3"/><line x1="370" y1="231" x2="360.3465918192059" y2="236.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="370" y1="231" x2="360.3465918192059" y2="225.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="55" y="272" width="230" height="48" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="170.0" y="302.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Artikelstamm 3</text><line x1="285" y1="296" x2="370" y2="231" stroke="#26729b" stroke-width="3"/><line x1="370" y1="231" x2="365.5352376416305" y2="241.05315358896334" stroke="#26729b" stroke-width="3"/><line x1="370" y1="231" x2="359.12824155168965" y2="232.67477408673304" stroke="#26729b" stroke-width="3"/><rect x="370" y="188" width="230" height="86" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="485.0" y="225.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">ID-Mapping</text><text x="485.0" y="249.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Datenbereinigung</text><line x1="600" y1="231" x2="660" y2="231" stroke="#26729b" stroke-width="3"/><line x1="660" y1="231" x2="650.3465918192059" y2="236.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="660" y1="231" x2="650.3465918192059" y2="225.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="660" y="188" width="220" height="86" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="770.0" y="225.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Führende Quelle</text><text x="770.0" y="249.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Standardisierte IDs</text><line x1="880" y1="231" x2="925" y2="231" stroke="#26729b" stroke-width="3"/><line x1="925" y1="231" x2="915.3465918192059" y2="236.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="925" y1="231" x2="915.3465918192059" y2="225.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="925" y="188" width="220" height="86" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="1035.0" y="225.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Konsumenten</text><text x="1035.0" y="249.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Paralleltest</text><line x1="1035" y1="274" x2="1035" y2="306" stroke="#26729b" stroke-width="3"/><line x1="1035" y1="306" x2="1029.7263190753538" y2="296.3465918192059" stroke="#26729b" stroke-width="3"/><line x1="1035" y1="306" x2="1040.2736809246462" y2="296.3465918192059" stroke="#26729b" stroke-width="3"/><rect x="925" y="306" width="220" height="49" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="1035.0" y="336.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Freigabe / Rückkehr</text><text x="55" y="382" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Altsystem erst abschalten, wenn Abhängigkeiten und Historie geklärt sind.</text></g></svg>
