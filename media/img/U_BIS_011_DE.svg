<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Bestandsentnahme: Daten und Validierung</title><desc id="desc">Bestandswörterbuch A=12, B=7. Entnahme A:3 wird validiert und ergibt A=9, B=7. Ungültige Eingaben ändern keinen Wert.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Bestandsentnahme: Daten und Validierung</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Sequenzielles Beispiel, keine Transaktionsgarantie</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="55" y="160" width="220" height="85" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="165.0" y="196.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">A: 12   B: 7</text><text x="165.0" y="220.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Ausgangsdaten</text><line x1="275" y1="202" x2="345" y2="202" stroke="#26729b" stroke-width="3"/><line x1="345" y1="202" x2="335.3465918192059" y2="207.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="345" y1="202" x2="335.3465918192059" y2="196.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="345" y="160" width="210" height="85" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="450.0" y="196.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Entnahme A: 3</text><text x="450.0" y="220.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Eingabe</text><line x1="555" y1="202" x2="625" y2="202" stroke="#26729b" stroke-width="3"/><line x1="625" y1="202" x2="615.3465918192059" y2="207.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="625" y1="202" x2="615.3465918192059" y2="196.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="625" y="160" width="240" height="85" fill="#eef5f7" stroke="#64727e" stroke-width="2"/><text x="745.0" y="196.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">A vorhanden?</text><text x="745.0" y="220.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">0 &lt; 3 ≤ 12</text><line x1="865" y1="202" x2="925" y2="202" stroke="#26729b" stroke-width="3"/><line x1="925" y1="202" x2="915.3465918192059" y2="207.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="925" y1="202" x2="915.3465918192059" y2="196.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="925" y="160" width="220" height="85" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="1035.0" y="196.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">A: 9   B: 7</text><text x="1035.0" y="220.5" font-size="19" text-anchor="middle" fill="#23272b" font-weight="normal">Ergebnis</text><line x1="745" y1="245" x2="745" y2="295" stroke="#26729b" stroke-width="3"/><line x1="745" y1="295" x2="739.7263190753538" y2="285.3465918192059" stroke="#26729b" stroke-width="3"/><line x1="745" y1="295" x2="750.2736809246462" y2="285.3465918192059" stroke="#26729b" stroke-width="3"/><rect x="545" y="295" width="400" height="60" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="745.0" y="331.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Sonst: Fehler, keine Änderung</text><text x="875" y="190" font-size="17" text-anchor="start" fill="#23272b" font-weight="normal">Ja</text><text x="760" y="279" font-size="17" text-anchor="start" fill="#23272b" font-weight="normal">Nein</text></g></svg>
