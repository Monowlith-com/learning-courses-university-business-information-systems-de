<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">FIFO und SPT: Auftragsreihenfolge</title><desc id="desc">FIFO mit Dauern 8,2,5,1 ergibt Fertigstellungszeiten 8,10,15,16 und Mittel 12,25. SPT mit 1,2,5,8 ergibt 1,3,8,16 und Mittel 7. Gesamtdauer jeweils 16.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">FIFO und SPT: Auftragsreihenfolge</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Masterlabor: alle Aufträge stehen zu Zeitpunkt null bereit</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="55" y="185" font-size="23" text-anchor="start" fill="#23272b" font-weight="bold">FIFO</text><rect x="180" y="150" width="344" height="53" fill="#26729b" stroke="#ffffff" stroke-width="2"/><text x="352.0" y="184" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text><rect x="524" y="150" width="86" height="53" fill="#a9c9da" stroke="#ffffff" stroke-width="2"/><text x="567.0" y="184" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">2</text><rect x="610" y="150" width="215" height="53" fill="#47765f" stroke="#ffffff" stroke-width="2"/><text x="717.5" y="184" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text><rect x="825" y="150" width="43" height="53" fill="#e3c79b" stroke="#ffffff" stroke-width="2"/><text x="846.5" y="184" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">1</text><text x="895" y="180" font-size="22" text-anchor="start" fill="#23272b" font-weight="normal">Mittel: 12,25</text><text x="55" y="295" font-size="23" text-anchor="start" fill="#23272b" font-weight="bold">SPT</text><rect x="180" y="260" width="43" height="53" fill="#e3c79b" stroke="#ffffff" stroke-width="2"/><text x="201.5" y="294" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">1</text><rect x="223" y="260" width="86" height="53" fill="#a9c9da" stroke="#ffffff" stroke-width="2"/><text x="266.0" y="294" font-size="20" text-anchor="middle" fill="#23272b" font-weight="bold">2</text><rect x="309" y="260" width="215" height="53" fill="#47765f" stroke="#ffffff" stroke-width="2"/><text x="416.5" y="294" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text><rect x="524" y="260" width="344" height="53" fill="#26729b" stroke="#ffffff" stroke-width="2"/><text x="696.0" y="294" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text><text x="895" y="290" font-size="22" text-anchor="start" fill="#23272b" font-weight="normal">Mittel: 7</text><line x1="180" y1="351" x2="868" y2="351" stroke="#67717b" stroke-width="2"/><line x1="180" y1="351" x2="180" y2="358" stroke="#67717b" stroke-width="2"/><text x="180" y="381" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">0</text><line x1="266" y1="351" x2="266" y2="358" stroke="#67717b" stroke-width="2"/><text x="266" y="381" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">2</text><line x1="352" y1="351" x2="352" y2="358" stroke="#67717b" stroke-width="2"/><text x="352" y="381" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">4</text><line x1="438" y1="351" x2="438" y2="358" stroke="#67717b" stroke-width="2"/><text x="438" y="381" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">6</text><line x1="524" y1="351" x2="524" y2="358" stroke="#67717b" stroke-width="2"/><text x="524" y="381" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">8</text><line x1="610" y1="351" x2="610" y2="358" stroke="#67717b" stroke-width="2"/><text x="610" y="381" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">10</text><line x1="696" y1="351" x2="696" y2="358" stroke="#67717b" stroke-width="2"/><text x="696" y="381" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">12</text><line x1="782" y1="351" x2="782" y2="358" stroke="#67717b" stroke-width="2"/><text x="782" y="381" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">14</text><line x1="868" y1="351" x2="868" y2="358" stroke="#67717b" stroke-width="2"/><text x="868" y="381" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">16</text><text x="895" y="381" font-size="20" text-anchor="start" fill="#23272b" font-weight="normal">Gesamtdauer: 16</text></g></svg>
