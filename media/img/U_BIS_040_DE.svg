<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Effizienz und absoluter Stromverbrauch</title><desc id="desc">Je Dokument sinkt der Verbrauch von 8 auf 5 Wh, insgesamt steigt er von 800 auf 900 kWh pro Monat</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Effizienz und absoluter Stromverbrauch</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Fallstudie: 100.000 → 180.000 Dokumente pro Monat</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="300.0" y="147" font-size="22" text-anchor="middle" fill="#23272b" font-weight="bold">Je Dokument</text><line x1="100" y1="345" x2="500" y2="345" stroke="#67717b" stroke-width="2"/><rect x="160" y="213.0" width="100" height="132.0" fill="#a8b2bb" stroke="#a8b2bb" stroke-width="2"/><text x="210" y="204.0" font-size="22" text-anchor="middle" fill="#23272b" font-weight="normal">8 Wh</text><text x="210" y="375" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Alt</text><rect x="340" y="262.5" width="100" height="82.5" fill="#26729b" stroke="#26729b" stroke-width="2"/><text x="390" y="253.5" font-size="22" text-anchor="middle" fill="#23272b" font-weight="normal">5 Wh</text><text x="390" y="375" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Neu</text><text x="870.0" y="147" font-size="22" text-anchor="middle" fill="#23272b" font-weight="bold">Pro Monat</text><line x1="670" y1="345" x2="1070" y2="345" stroke="#67717b" stroke-width="2"/><rect x="730" y="213.0" width="100" height="132.0" fill="#a8b2bb" stroke="#a8b2bb" stroke-width="2"/><text x="780" y="204.0" font-size="22" text-anchor="middle" fill="#23272b" font-weight="normal">800 kWh</text><text x="780" y="375" font-size="20" t