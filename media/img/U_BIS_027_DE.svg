<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Schutzmaßnahmen für Administratorkonten</title><desc id="desc">Gemeinsames Administratorkonto: individuelle Konten verbessern Zuordnung, MFA schützt Anmeldung, minimale Rechte begrenzen Zugriff, Wiederherstellung hilft bei Ausfall.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Schutzmaßnahmen für Administratorkonten</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Beispiel: unterschiedliche Maßnahmen gegen unterschiedliche Risiken</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><rect x="65" y="145" width="385" height="46" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="257.5" y="174.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Fehlende Zuordnung</text><line x1="450" y1="168" x2="595" y2="168" stroke="#26729b" stroke-width="3"/><line x1="595" y1="168" x2="585.3465918192059" y2="173.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="595" y1="168" x2="585.3465918192059" y2="162.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="595" y="145" width="540" height="46" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="865.0" y="174.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Individuelle Konten + Logs</text><rect x="65" y="205" width="385" height="46" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="257.5" y="234.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Kontodiebstahl</text><line x1="450" y1="228" x2="595" y2="228" stroke="#26729b" stroke-width="3"/><line x1="595" y1="228" x2="585.3465918192059" y2="233.27368092464624" stroke="#26729b" stroke-width="3"/><line x1="595" y1="228" x2="585.3465918192059" y2="222.72631907535376" stroke="#26729b" stroke-width="3"/><rect x="595" y="205" width="540" height="46" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="865.0" y="234.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">MFA, möglichst phishing-resistent</text><rect x="65" y="265" width="385" height="46" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="257.5" y="294.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Übermäßige Rechte</text><line x1="450" y1="288" x2="595" y2="288" stroke="#26729b" stroke-width="3"/><line x1="595" y1="288" x2="585.3465918192059" y2="293.2736809246462" stroke="#26729b" stroke-width="3"/><line x1="595" y1="288" x2="585.3465918192059" y2="282.7263190753538" stroke="#26729b" stroke-width="3"/><rect x="595" y="265" width="540" height="46" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="865.0" y="294.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Minimale Rechte</text><rect x="65" y="325" width="385" height="46" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="257.5" y="354.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Systemausfall</text><line x1="450" y1="348" x2="595" y2="348" stroke="#26729b" stroke-width="3"/><line x1="595" y1="348" x2="585.3465918192059" y2="353.2736809246462" stroke="#26729b" stroke-width="3"/><line x1="595" y1="348" x2="585.3465918192059" y2="342.7263190753538" stroke="#26729b" stroke-width="3"/><rect x="595" y="325" width="540" height="46" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="865.0" y="354.0" font-size="19" text-anchor="middle" fill="#23272b" font-weight="bold">Getestete Wiederherstellung</text></g></svg>
