<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Störungsmodell: Konfusionsmatrix</title><desc id="desc">100 Fälle: 10 richtig positive, 10 falsch positive, 5 falsch negative, 75 richtig negative. Präzision 50 %, Recall rund 66,7 %.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Störungsmodell: Konfusionsmatrix</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">100 Fälle, 20 als Störung markiert, 15 tatsächliche Störungen</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="445" y="145" font-size="21" text-anchor="middle" fill="#23272b" font-weight="normal">Vorhersage</text><text x="335" y="178" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Störung</text><text x="555" y="178" font-size="20" text-anchor="middle" fill="#23272b" font-weight="normal">Keine Störung</text><text x="48" y="170" font-size="18" text-anchor="start" fill="#23272b" font-weight="normal">Tatsächlich</text><text x="205" y="230" font-size="20" text-anchor="end" fill="#23272b" font-weight="normal">Störung</text><text x="205" y="312" font-size="20" text-anchor="end" fill="#23272b" font-weight="normal">Keine Störung</text><rect x="235" y="190" width="200" height="72" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="335" y="222" font-size="27" text-anchor="middle" fill="#23272b" font-weight="bold">10</text><text x="335" y="247" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">TP</text><rect x="455" y="190" width="200" height="72" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="555" y="222" font-size="27" text-anchor="middle" fill="#23272b" font-weight="bold">5</text><text x="555" y="247" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">FN</text><rect x="235" y="272" width="200" height="72" fill="#f8ece5" stroke="#64727e" stroke-width="2"/><text x="335" y="304" font-size="27" text-anchor="middle" fill="#23272b" font-weight="bold">10</text><text x="335" y="329" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">FP</text><rect x="455" y="272" width="200" height="72" fill="#e3f0eb" stroke="#64727e" stroke-width="2"/><text x="555" y="304" font-size="27" text-anchor="middle" fill="#23272b" font-weight="bold">75</text><text x="555" y="329" font-size="17" text-anchor="middle" fill="#23272b" font-weight="normal">TN</text><text x="725" y="181" font-size="23" text-anchor="start" fill="#23272b" font-weight="normal">Präzision = 10/20 = 50 %</text><text x="725" y="231" font-size="23" text-anchor="start" fill="#23272b" font-weight="normal">Recall = 10/15 ≈ 66,7 %</text><text x="725" y="281" font-size="23" text-anchor="start" fill="#23272b" font-weight="normal">F1 = 20/35 ≈ 57,1 %</text><text x="725" y="335" font-size="19" text-anchor="start" fill="#23272b" font-weight="normal">Schwelle auf Validierungsdaten wählen</text></g></svg>
