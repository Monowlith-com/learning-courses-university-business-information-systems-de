<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Wirtschaftlicher Wert einer Prognose</title><desc id="desc">Prognose spart erwartete 25 Euro pro Tag, kostet 15 Euro pro Tag und ergibt einen erwarteten Nettonutzen von 10 Euro pro Tag.</desc><rect width="1200" height="420" fill="#fff"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="31" text-anchor="start" fill="#23272b" font-weight="bold">Wirtschaftlicher Wert einer Prognose</text><text x="48" y="87" font-size="21" text-anchor="start" fill="#525b63" font-weight="normal">Selbstkontrolle: erwartete Beträge pro Tag</text><line x1="48" y1="108" x2="1152" y2="108" stroke="#b8bfc6" stroke-width="2"/><text x="55" y="178" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">Einsparung</text><rect x="260" y="150" width="625" height="42" fill="#26729b" stroke="#26729b" stroke-width="2"/><text x="900" y="178" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">25 EUR</text><text x="55" y="248" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">Kosten</text><rect x="260" y="220" width="375" height="42" fill="#98572b" stroke="#98572b" stroke-width="2"/><text x="650" y="248" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">15 EUR</text><text x="55" y="318" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">Nettonutzen</text><rect x="260" y="290" width="250" height="42" fill="#47765f" stroke="#47765f" stroke-width="2"/><text x="525" y="318" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">10 EUR</text><text x="55" y="385" font-size="21" text-anchor="start" fill="#23272b" font-weight="normal">25 − 15 = 10 EUR; Erwartungswerte, kein garantierter Gewinn.</text></g></svg>
